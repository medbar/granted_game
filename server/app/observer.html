<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Джин · Observer</title>
  <style>
    :root{--bg:#071118;--panel:#0d1c24;--panel2:#102630;--line:#1b3c48;--text:#e8f4f5;--muted:#82a2aa;--cyan:#5eead4;--gold:#f6c85f;--red:#ff6b6b;--green:#76e0a3;--blue:#65bfff}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 85% -10%,#12313d 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,sans-serif;min-height:100vh}
    button,input{font:inherit}.shell{max-width:1540px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:18px;margin-bottom:20px}.brand{font-size:24px;font-weight:800;letter-spacing:.06em}.brand span{color:var(--cyan)}.subtitle{color:var(--muted);margin-right:auto}.refresh{border:1px solid #2b6873;color:var(--cyan);background:#0c252c;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:700}.refresh:hover{background:#123640}.stamp{color:var(--muted);font-size:12px;min-width:125px;text-align:right}
    .metrics{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;margin-bottom:18px}.metric{background:linear-gradient(145deg,#10242d,#0b1920);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.metric .label{text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:10px}.metric .value{font-size:25px;font-weight:800;margin-top:4px}.metric .note{font-size:11px;color:var(--muted)}.good{color:var(--green)!important}.bad{color:var(--red)!important}.warn{color:var(--gold)!important}
    .workspace{display:grid;grid-template-columns:390px 1fr;gap:16px;min-height:650px}.panel{background:rgba(11,26,34,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.panel-title{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-right:auto}.search{width:170px;background:#07151c;border:1px solid #21434e;color:var(--text);border-radius:8px;padding:8px 10px;outline:none}.search:focus{border-color:var(--cyan)}
    .filters{display:flex;gap:6px;padding:10px 13px;border-bottom:1px solid var(--line)}.chip{border:1px solid #234650;background:transparent;color:var(--muted);padding:5px 9px;border-radius:20px;cursor:pointer;font-size:11px}.chip.active{color:#071118;background:var(--cyan);border-color:var(--cyan);font-weight:800}.requests{max-height:590px;overflow:auto}.request{padding:13px 16px;border-bottom:1px solid #142f39;cursor:pointer}.request:hover{background:#102630}.request.selected{background:#12313b;box-shadow:inset 3px 0 var(--cyan)}.request-top{display:flex;align-items:center;gap:8px}.request-id{font:12px Consolas,monospace;color:var(--cyan)}.status{margin-left:auto;border-radius:10px;padding:2px 7px;font-size:10px;text-transform:uppercase;font-weight:800}.status.completed{color:var(--green);background:#123728}.status.failed,.status.impossible{color:var(--red);background:#3a1b20}.status.running,.status.planning,.status.action_ready,.status.replanning{color:var(--gold);background:#3a3218}.wish{margin:7px 0 5px;font-weight:650}.meta{color:var(--muted);font-size:11px;display:flex;gap:12px}
    .detail{min-width:0}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);padding:40px}.detail-content{padding:19px 22px;max-height:710px;overflow:auto}.detail-title{font-size:22px;font-weight:800;margin:0 0 5px}.detail-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;margin-bottom:22px}.tag{border:1px solid #28515d;border-radius:14px;padding:3px 8px}.section{margin-top:24px}.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}.timeline{border-left:2px solid #214651;margin-left:8px;padding-left:19px}.event{position:relative;margin-bottom:16px}.event:before{content:"";position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #0b1a22}.event.failed:before{background:var(--red)}.event.completed:before,.event.action:before{background:var(--green)}.event-title{font-weight:750}.event-time{font:11px Consolas,monospace;color:var(--muted);margin-left:8px}.event-body{color:#b9d0d5;margin-top:3px;white-space:pre-wrap;word-break:break-word}
    .notice{border:1px solid #59323a;background:#25161b;color:#ffc1c1;border-radius:10px;padding:12px 14px;margin-bottom:10px}.notice.warn-note{border-color:#665326;background:#292413;color:#ffe39a}.code{margin:0;background:#061017;border:1px solid #183844;border-radius:10px;padding:15px;color:#bff8ed;white-space:pre-wrap;overflow:auto;overflow-wrap:anywhere;font:12px/1.65 Consolas,monospace;max-height:340px}.summary-box{background:#10242d;border:1px solid #1e4551;padding:13px 15px;border-radius:10px}.actions{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}.actions th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:8px;border-bottom:1px solid var(--line)}.actions th:nth-child(1){width:34px}.actions th:nth-child(2){width:95px}.actions th:nth-child(3){width:95px}.actions td{padding:9px 8px;border-bottom:1px solid #142f39;vertical-align:top;overflow-wrap:anywhere}.observation{margin:0;white-space:pre-wrap;word-break:break-word;color:inherit;font:11px/1.5 Consolas,monospace}.raw summary{cursor:pointer;color:var(--muted);padding:8px 0}.raw pre{font-size:11px}.metric-list{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:7px}.metric-row{display:flex;gap:12px;justify-content:space-between;border-bottom:1px solid #17323b;padding:6px 2px;color:var(--muted)}.metric-row b{font-family:Consolas,monospace;color:var(--text)}
    .artifact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.artifact-card{background:#0a1820;border:1px solid var(--line);border-radius:12px;overflow:hidden}.artifact-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#05080f}.artifact-body{padding:12px}.artifact-title{font-weight:800;margin-bottom:4px}.artifact-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.artifact-links a{color:var(--cyan);text-decoration:none;border:1px solid #28515d;border-radius:7px;padding:4px 7px;font-size:11px}.artifact-links a:hover{background:#12313b}
    @media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.requests{max-height:320px}.subtitle{display:none}}@media(max-width:600px){.shell{padding:12px}.top{flex-wrap:wrap}.metrics{grid-template-columns:1fr 1fr}.workspace{display:block}.detail{margin-top:12px}.search{width:130px}.metric-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">ДЖИН <span>/ OBSERVER</span></div><div class="subtitle">логи · метрики · траектории · визуальные эвалы</div><div class="stamp" id="stamp">ещё не загружено</div><button class="refresh" id="plugins">ПЛАГИНЫ</button><button class="refresh" id="artifacts">АРТЕФАКТЫ</button><button class="refresh" id="refresh">ОБНОВИТЬ</button></header>
    <section class="metrics" id="metricCards"></section>
    <section class="workspace">
      <aside class="panel">
        <div class="panel-head"><div class="panel-title">Желания</div><input class="search" id="search" placeholder="поиск"></div>
        <div class="filters"><button class="chip active" data-filter="all">Все</button><button class="chip" data-filter="failed">Ошибки</button><button class="chip" data-filter="completed">Успешные</button></div>
        <div class="requests" id="requests"></div>
      </aside>
      <article class="panel detail" id="detail"><div class="empty">Выберите желание слева<br>и увидите его путь через систему</div></article>
    </section>
  </main>
  <script>
    const state={overview:null,selected:null,filter:'all',query:''};
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const metric=name=>state.overview?.metrics.find(m=>m.name===name)?.value??0;
    function ms(v){if(v===null||v===undefined)return '—';return v>=1000?(v/1000).toFixed(1)+' с':Math.round(v)+' мс'}
    function localTime(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.valueOf())?v:d.toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'})}
    function renderMetrics(){const ttfa=metric('granted_agent_time_to_first_action_milliseconds'),slo=metric('granted_agent_ttfa_slo_met');const cards=[['Желаний',metric('granted_agent_requests_total'),'текущий запуск',''],['Ошибок',metric('granted_agent_errors_total'),'текущий запуск',metric('granted_agent_errors_total')?'bad':'good'],['Первое действие',ms(ttfa),'цель ≤ 2 с',slo?'good':'bad'],['Полное исполнение',ms(metric('granted_agent_last_run_latency_milliseconds')),'последний запуск',''],['SLO',slo?'Соблюдён':'Нарушен','time to first action',slo?'good':'bad']];$('metricCards').innerHTML=cards.map(c=>`<div class="metric"><div class="label">${c[0]}</div><div class="value ${c[3]}">${c[1]}</div><div class="note">${c[2]}</div></div>`).join('')}
    function visibleRequests(){return (state.overview?.requests||[]).filter(r=>{const statusOk=state.filter==='all'||(state.filter==='failed'?(r.status==='failed'||r.status==='impossible'):r.status==='completed');const q=state.query.toLowerCase();return statusOk&&(!q||r.request_id.toLowerCase().includes(q)||(r.wish||'').toLowerCase().includes(q))})}
    function renderRequests(){const rows=visibleRequests();$('requests').innerHTML=rows.length?rows.map(r=>`<div class="request ${r.request_id===state.selected?'selected':''}" data-id="${esc(r.request_id)}"><div class="request-top"><span class="request-id">${esc(r.request_id)}</span><span class="status ${esc(r.status)}">${esc(r.status)}</span></div><div class="wish">${esc(r.wish||'Без текста желания')}</div><div class="meta"><span>${localTime(r.started_at)}</span><span>${r.action_count} действ.</span><span>${ms(r.latency_ms)}</span></div></div>`).join(''):'<div class="empty">Ничего не найдено</div>';document.querySelectorAll('.request').forEach(el=>el.onclick=()=>selectRequest(el.dataset.id))}
    const eventNames={'agent.run.started':'Планировщик получил желание','agent.program.fast_path':'Выбран быстрый сценарий','agent.program.attempt':'Попытка программы','agent.program.generation_failed':'Генерация программы не удалась','agent.program.repair_failed':'Ремонт программы не удался','agent.first_world_action':'Первое запланированное изменение','agent.first_action':'Первое действие','agent.first_action.client_observed':'Действие увидел клиент','agent.action':'Запланированное действие','agent.run.completed':'План готов','agent.run.failed':'Планировщик упал','agent.loop.planning':'Джин планирует','agent.loop.started':'Цикл исполнения начат','agent.loop.action_ready':'Действие отправлено в мир','agent.loop.feedback':'Мир проверил действие','agent.loop.replanning':'Джин пробует иначе','agent.loop.completed':'Желание исполнено и проверено','agent.loop.failed':'Все попытки исчерпаны','genie.curse.activated':'Активировано проклятие'};
    function eventBody(e){if(e.error)return e.error;if(e.event==='agent.loop.feedback')return `${e.action||''}${e.target_id?' → '+e.target_id:''} · ${e.verified?'подтверждено':'не сработало'}\n${e.detail||''}`;if(e.event==='agent.loop.action_ready')return `Попытка ${e.attempt||1} · шаг ${(e.action_index??0)+1} · ${e.action||''}${e.target_id?' → '+e.target_id:''}`;if(e.event==='agent.action')return `${e.action||''}${e.target_id?' → '+e.target_id:''}\n${e.observation||''}`;if(e.attempt!==undefined)return `Попытка ${e.attempt} · источник: ${e.source||'model'} · действий: ${e.action_count??0} · результат: ${e.fulfilled?'исполнено':'нужна ещё попытка'}`;if(e.wish)return '«'+e.wish+'»';if(e.code)return e.code;if(e.time_to_first_action_ms!==undefined)return ms(e.time_to_first_action_ms);if(e.status)return `Статус: ${e.status} · действий: ${e.action_count??0} · ${ms(e.latency_ms)}`;return ''}
    function prettyObservation(value){const text=String(value??'—');try{return JSON.stringify(JSON.parse(text),null,2)}catch{return text}}
    function renderDetail(data){const r=(state.overview.requests||[]).find(x=>x.request_id===data.request_id)||{};const t=data.trajectory;const events=data.events.map(e=>`<div class="event ${e.event.includes('failed')?'failed':e.event.includes('completed')?'completed':e.event==='agent.action'?'action':''}"><div><span class="event-title">${esc(eventNames[e.event]||e.event)}</span><span class="event-time">${localTime(e.timestamp)}</span></div><div class="event-body">${esc(eventBody(e))}</div></div>`).join('');const checks=data.events.filter(e=>e.event==='agent.loop.feedback');const verification=checks.length?`<section class="section"><h2>Проверка мира (${checks.length})</h2><table class="actions"><thead><tr><th>#</th><th>Попытка</th><th>Действие</th><th>Цель</th><th>Факт</th></tr></thead><tbody>${checks.map((e,i)=>`<tr><td>${i+1}</td><td>${e.attempt||1}</td><td>${esc(e.action||'—')}</td><td>${esc(e.target_id||'—')}</td><td class="${e.verified?'good':'bad'}">${esc(e.detail||'—')}</td></tr>`).join('')}</tbody></table></section>`:'';let trajectory='';if(t){const p=t.program||{},actions=t.actions||[],ev=t.evaluation||{},con=t.conclusion||{},flat=Boolean(p.code)&&!String(p.code).includes('\n')&&String(p.code).includes('#');trajectory=`<section class="section"><h2>Итог планировщика</h2><div class="summary-box"><b>${esc(con.status||'—')}</b> · ${esc(con.summary||'Без пояснения')}<br><span style="color:var(--muted)">Оценка: ${ev.score??'—'} · валидность действий: ${ev.valid_action_ratio??'—'} · эффективность: ${ev.action_efficiency??'—'}</span></div></section><section class="section"><h2>Программа джина</h2>${flat?'<div class="notice warn-note">Модель прислала код одной строкой. Всё после первого # стало комментарием и не исполнялось. Ниже показан точный исходник, без выдуманных переносов.</div>':''}${p.error?`<div class="notice">${esc(p.error)}</div>`:''}<pre class="code">${esc(p.code||'Код не сохранён')}</pre></section><section class="section"><h2>Запланированные действия (${actions.length})</h2>${actions.length?`<table class="actions"><thead><tr><th>#</th><th>Действие</th><th>Цель</th><th>Результат симуляции</th></tr></thead><tbody>${actions.map(a=>`<tr><td>${a.sequence}</td><td>${esc(a.kind)}</td><td>${esc(a.target_id||'—')}</td><td class="${a.success?'good':'bad'}"><pre class="observation">${esc(prettyObservation(a.observation))}</pre></td></tr>`).join('')}</tbody></table>`:'<div class="notice">Запланированных действий не было.</div>'}</section><details class="raw section"><summary>Исходный JSON траектории</summary><pre class="code">${esc(JSON.stringify(t,null,2))}</pre></details>`}else{trajectory=`<section class="section"><h2>Траектория</h2><div class="notice">Траектория не сохранена. Обычно это означает, что агент упал до штатного завершения. Причину смотрите во временной шкале.</div></section>`}const allMetrics=(state.overview.metrics||[]).map(m=>`<div class="metric-row"><span>${esc(m.name)}</span><b>${m.value}</b></div>`).join('');$('detail').innerHTML=`<div class="detail-content"><h1 class="detail-title">${esc(r.wish||data.request_id)}</h1><div class="detail-meta"><span class="tag">${esc(data.request_id)}</span><span class="tag">${esc(r.status||'—')}</span><span class="tag">${r.action_count||0} действий</span><span class="tag">TTFA ${ms(r.ttfa_ms)}</span><span class="tag">всего ${ms(r.latency_ms)}</span></div><section class="section"><h2>События</h2><div class="timeline">${events}</div></section>${verification}${trajectory}<details class="raw section"><summary>Все текущие метрики</summary><div class="metric-list">${allMetrics}</div></details></div>`}
    async function selectRequest(id){state.selected=id;renderRequests();$('detail').innerHTML='<div class="empty">Читаю файлы…</div>';try{const res=await fetch('/observer/api/requests/'+encodeURIComponent(id),{cache:'no-store'});if(!res.ok)throw new Error(await res.text());renderDetail(await res.json())}catch(e){$('detail').innerHTML=`<div class="empty bad">Не удалось прочитать запрос<br>${esc(e.message)}</div>`}}
    async function showArtifacts(){state.selected=null;renderRequests();$('detail').innerHTML='<div class="empty">Читаю JSON и PNG…</div>';try{const res=await fetch('/observer/api/artifacts',{cache:'no-store'});if(!res.ok)throw new Error(await res.text());const data=await res.json();const cards=(data.cases||[]).map(item=>`<article class="artifact-card">${item.png_url?`<a href="${esc(item.png_url)}" target="_blank"><img src="${esc(item.png_url)}" alt="${esc(item.case_id)}"></a>`:''}<div class="artifact-body"><div class="artifact-title ${item.passed?'good':'bad'}">${esc(item.case_id)} · ${item.passed?'PASS':'FAIL'}</div><div>${esc(item.wish||item.suite)}</div><div class="meta"><span>${esc(item.suite)}</span><span>${esc(item.level_version||'')}</span></div>${item.issues?.length?`<div class="notice">${esc(item.issues.join('; '))}</div>`:''}<div class="artifact-links">${item.before_json_url?`<a href="${esc(item.before_json_url)}" target="_blank">JSON до</a>`:''}${item.after_json_url?`<a href="${esc(item.after_json_url)}" target="_blank">JSON после</a>`:''}<a href="${esc(item.result_json_url)}" target="_blank">Результат</a>${item.png_url?`<a href="${esc(item.png_url)}" target="_blank">PNG</a>`:''}</div></div></article>`).join('');$('detail').innerHTML=`<div class="detail-content"><h1 class="detail-title">Визуальные эвалы</h1><div class="detail-meta"><span class="tag">${data.case_count||0} кейсов</span><span class="tag">JSON до / после</span><span class="tag">реальный кадр Godot</span></div><div class="artifact-grid">${cards||'<div class="notice">Артефактов пока нет.</div>'}</div></div>`}catch(e){$('detail').innerHTML=`<div class="empty bad">Не удалось прочитать артефакты<br>${esc(e.message)}</div>`}}
    async function showPlugins(){state.selected=null;renderRequests();$('detail').innerHTML='<div class="empty">Читаю манифесты плагинов…</div>';try{const res=await fetch('/genie/plugins',{cache:'no-store'});if(!res.ok)throw new Error(await res.text());const data=await res.json();const cards=(data.plugins||[]).map(item=>`<article class="artifact-card"><div class="artifact-body"><div class="artifact-title ${item.enabled?'good':'bad'}">${esc(item.id)} · ${item.enabled?'ВКЛЮЧЁН':'ВЫКЛЮЧЕН'}</div><div>${esc(item.description)}</div><div class="meta"><span>v${esc(item.version)}</span><span>${item.capabilities.length} действий</span></div><pre class="observation">${esc(item.capabilities.join('\n'))}</pre><button class="refresh plugin-toggle" data-plugin="${esc(item.id)}" data-enabled="${item.enabled}">${item.enabled?'ОТКЛЮЧИТЬ':'ВКЛЮЧИТЬ'}</button></div></article>`).join('');$('detail').innerHTML=`<div class="detail-content"><h1 class="detail-title">Возможности джина</h1><div class="detail-meta"><span class="tag">revision ${data.revision}</span><span class="tag">${data.capabilities.length} доступных действий</span><span class="tag">hot reload</span></div><div class="artifact-grid">${cards}</div></div>`;document.querySelectorAll('.plugin-toggle').forEach(button=>button.onclick=async()=>{button.disabled=true;button.textContent='ПРИМЕНЯЮ…';await fetch('/genie/plugins/'+encodeURIComponent(button.dataset.plugin),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:button.dataset.enabled!=='true'})});await showPlugins()})}catch(e){$('detail').innerHTML=`<div class="empty bad">Не удалось прочитать плагины<br>${esc(e.message)}</div>`}}
    async function refresh(){const btn=$('refresh');btn.disabled=true;btn.textContent='ЧИТАЮ…';try{const res=await fetch('/observer/api/overview',{cache:'no-store'});if(!res.ok)throw new Error(await res.text());state.overview=await res.json();renderMetrics();renderRequests();$('stamp').textContent='обновлено '+new Date().toLocaleTimeString('ru-RU');if(state.selected&&state.overview.requests.some(r=>r.request_id===state.selected))await selectRequest(state.selected);else if(state.overview.requests.length)await selectRequest(state.overview.requests[0].request_id)}catch(e){$('detail').innerHTML=`<div class="empty bad">Панель не смогла прочитать файлы<br>${esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='ОБНОВИТЬ'}}
    $('refresh').onclick=refresh;$('artifacts').onclick=showArtifacts;$('plugins').onclick=showPlugins;$('search').oninput=e=>{state.query=e.target.value;renderRequests()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderRequests()});refresh();
  </script>
</body>
</html>
