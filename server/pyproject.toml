[project]
name = "granted-game-server"
version = "0.1.0"
description = "Deterministic natural-language spell compiler for Granted Game"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-monty>=0.0.21",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
